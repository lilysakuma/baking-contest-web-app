<!DOCTYPE html>
<html>
    <head>
        <title>Baking Contest Results</title>
    </head>

<body>
        <h2>Baking Contest Results</h2>

        <table border="1">
            <tr>
                <th>Entry ID</th>
                <th>User ID</th>
                <th>Name Of Baking Item</th>
                <th>Excellent Votes</th>
                <th>OK Votes</th>
                <th>Bad Votes</th>
            </tr>
            {% for entry in entries %}
            <tr>
                <td>{{entry[0]}}</td>
                <td>{{entry[1]}}</td>
                <td>{{entry[2]}}</td>
                <td>{{entry[3]}}</td>
                <td>{{entry[4]}}</td>
                <td>{{entry[5]}}</td>
            </tr>
            {% endfor %}
        </table>
        <p><a href="/">Back to Home</a></p>
</body>
</html>
